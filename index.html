<style>
/* Carnet de comptes : une colonne, en-tête de mois collant, onglets, saisie en feuille glissante */
:root{
  --bg:#F3F5F2; --surface:#FFFFFF; --sunk:#E8ECE7; --line:#D5DBD3;
  --ink:#17201C; --muted:#5E6A63; --faint:#8C978F;
  --foyer:#22704F; --foyer-soft:#DCEDE3;
  --pro:#3A4FC4; --pro-soft:#E1E5FA;
  --dieu:#9A6B12; --dieu-soft:#F4EAD3;
  --pos:#1E7B47; --neg:#B83A2E; --warn:#A86A00; --neg-soft:#F7E1DE; --warn-soft:#F8ECD3;
  --display:"Familjen Grotesk","Helvetica Neue",Arial,sans-serif;
  --body:"Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:10px; color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#111613; --surface:#18201C; --sunk:#202923; --line:#2C3731;
  --ink:#E7EDE9; --muted:#9BA8A0; --faint:#6F7C74;
  --foyer:#5CC08F; --foyer-soft:#1C3328; --pro:#8E9DF5; --pro-soft:#22284A;
  --dieu:#D9A64A; --dieu-soft:#3A2F17;
  --pos:#5CC08F; --neg:#F07A6C; --warn:#E3A93D; --neg-soft:#3B201D; --warn-soft:#3A2D14; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);-webkit-text-size-adjust:100%;padding-top:env(safe-area-inset-top,0px)}
[hidden]{display:none!important}
.num,.amt{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
button,input,select{font:inherit;color:inherit}
input,select{font-size:16px}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--pro);outline-offset:2px}
.wrap{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 130px}

header.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 0}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.brand h1{font:700 19px/1.1 var(--display);margin:0;letter-spacing:-.01em}
.brand small{color:var(--muted);font-size:12px}
.monthbar{display:flex;align-items:center;gap:6px;margin-top:10px}
.monthbar button{border:1px solid var(--line);background:var(--surface);border-radius:8px;width:36px;height:36px;display:grid;place-items:center}
.monthbar .m{flex:1;text-align:center;font:600 16px var(--display);text-transform:capitalize}
.monthbar .m span{display:block;font:400 11px var(--body);color:var(--muted);text-transform:none}
nav.tabs{display:flex;gap:2px;overflow-x:auto;margin-top:10px;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{border:0;background:none;padding:9px 12px 10px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--ink)}

section.view{display:grid;gap:18px;padding-top:18px}
h2{font:600 13px var(--body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 8px}
h3{font:600 17px var(--display);margin:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px}
.muted{color:var(--muted)} .small{font-size:13px}
.pos{color:var(--pos)} .neg{color:var(--neg)}
.hero{display:grid;gap:4px}
.hero .lab{color:var(--muted);font-size:13px}
.hero .big{font:500 clamp(34px,8vw,48px)/1.05 var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.flow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-top:12px}
.flow div{background:var(--surface);padding:10px 12px;min-width:0}
.flow .k{font-size:12px;color:var(--muted);line-height:1.3} .flow .v{font:500 16px var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap;letter-spacing:-.03em}
@media (max-width:440px){.flow .v{font-size:13px}.flow div{padding:9px 8px}}
.env{display:grid;gap:14px}
.env-row{display:grid;gap:5px}
.env-head{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.env-head b{font-weight:600}
.env-head .num{font-size:13px;color:var(--muted)}
.bar{height:8px;border-radius:4px;background:var(--sunk);position:relative;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;border-radius:4px}
.bar .over{background:var(--neg)!important}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:500;padding:2px 8px;border-radius:99px;white-space:nowrap;background:var(--sunk);color:var(--muted)}
.chip.ok{background:var(--foyer-soft);color:var(--foyer)}
.chip.bad{background:var(--neg-soft);color:var(--neg)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.pro{background:var(--pro-soft);color:var(--pro)}
.chip.foyer{background:var(--foyer-soft);color:var(--foyer)}
.alerts{display:grid;gap:8px}
.alert{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:var(--r);font-size:14px;border:1px solid var(--line);background:var(--surface)}
.alert .dot{width:8px;height:8px;border-radius:50%;margin-top:7px;flex:none;background:var(--pos)}
.alert.warn .dot{background:var(--warn)} .alert.bad .dot{background:var(--neg)}
.rows{display:grid}
.row{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:10px 0;border-bottom:1px solid var(--line);align-items:center}
.row:last-child{border-bottom:0}
.row .t{min-width:0;overflow-wrap:anywhere}
.row .s{grid-column:1;font-size:12px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.row .amt{grid-row:1/span 2;grid-column:2;text-align:right;font-size:15px}
button.row{background:none;border:0;border-bottom:1px solid var(--line);text-align:left;width:100%;padding-inline:0}
button.row:hover{background:var(--sunk)}
.dayhead{font-size:12px;color:var(--faint);text-transform:uppercase;letter-spacing:.06em;padding:14px 0 2px}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-weight:500;color:var(--muted);text-align:right;padding:6px 8px;border-bottom:1px solid var(--line);font-size:12px;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
td{padding:8px;border-bottom:1px solid var(--line);text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
td:first-child{font-family:var(--body)}
tr.cur td{background:var(--sunk)}
.seg{display:inline-flex;background:var(--sunk);border-radius:8px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:6px 11px;border-radius:6px;font-size:13px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=date],input[type=search],select{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%;min-width:0}
label.f{display:grid;gap:4px;font-size:13px;color:var(--muted);min-width:0}
label.f > span{font-weight:500}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 14px;font-weight:500;font-size:14px}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.danger{color:var(--neg)}
.btn.sm{padding:3px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.linkbtn{border:0;background:none;color:var(--pro);padding:0;font-weight:500;text-decoration:underline;text-underline-offset:3px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.check{display:flex;gap:8px;align-items:center;font-size:14px}
.fab{position:fixed;right:calc(max(16px,env(safe-area-inset-right,0px)) + 4px);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:30;height:54px;padding:0 20px;border-radius:27px;border:0;background:var(--ink);color:var(--bg);font:600 15px var(--body);box-shadow:0 6px 20px rgba(0,0,0,.22);display:flex;align-items:center;gap:8px}
.fab svg{width:18px;height:18px}
.scrim{position:fixed;inset:0;background:rgba(10,15,12,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:16px 16px 0 0;max-height:92%;overflow-y:auto;padding:18px max(18px,env(safe-area-inset-left,0px)) calc(18px + env(safe-area-inset-bottom,0px));display:grid;gap:14px}
@media (min-width:640px){.scrim{align-items:center}.sheet{border-radius:16px}}
.sheet .amtin{font:500 34px var(--mono);border:0;border-bottom:2px solid var(--line);border-radius:0;padding:4px 0;background:none}
.typesw{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.typesw button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px;font-weight:600}
.typesw button:disabled{opacity:.45}
.typesw button[aria-pressed="true"].in{background:var(--foyer-soft);border-color:var(--foyer);color:var(--foyer)}
.typesw button[aria-pressed="true"].out{background:var(--neg-soft);border-color:var(--neg);color:var(--neg)}
.typesw button[aria-pressed="true"].foy{background:var(--foyer-soft);border-color:var(--foyer);color:var(--foyer)}
.typesw button[aria-pressed="true"].pr{background:var(--pro-soft);border-color:var(--pro);color:var(--pro)}
.sheet-actions{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap}
.confirm{background:var(--neg-soft);border-radius:8px;padding:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:14px;z-index:50;max-width:calc(100% - 32px)}
.empty{text-align:center;padding:40px 16px;color:var(--muted)}
.empty h3{color:var(--ink);margin-bottom:6px}
svg text{fill:var(--muted);font:11px var(--body)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.kv{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:14px}
.kv .num{text-align:right}
.kv .tot{border-top:1px solid var(--line);padding-top:6px;font-weight:600}
.note{font-size:12px;color:var(--faint)}
/* vue budget */
table.budget{font-size:13px}table.budget td,table.budget th{padding:7px 5px}table.budget td:first-child{display:flex;align-items:center;gap:8px;white-space:normal;min-width:120px}table.budget .obj{display:block;font-size:11px;color:var(--muted)}
.sw{width:10px;height:10px;border-radius:3px;flex:none;background:var(--muted)}
.sw-dieu{background:var(--dieu)}.sw-epargne{background:var(--ink)}.sw-fixe{background:var(--foyer)}.sw-variable{background:var(--pro)}
.bgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;align-items:start}
.bsec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:4px 14px 10px;border-top:3px solid var(--muted)}
.bsec-revenu{border-top-color:var(--pos)}.bsec-fixe{border-top-color:var(--foyer)}.bsec-variable{border-top-color:var(--pro)}.bsec-dieu{border-top-color:var(--dieu)}.bsec-epargne{border-top-color:var(--ink)}.bsec-futur{border-top-color:var(--warn)}
.bsec-h{display:flex;justify-content:space-between;align-items:baseline;padding:10px 0 6px;border-bottom:1px solid var(--line);gap:8px}
.bsec-h .num{font-weight:500}
.bl{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;width:100%;background:none;border:0;border-bottom:1px solid var(--line);padding:8px 0;text-align:left}
button.bl:hover{background:var(--sunk)}
.bl-l{min-width:0;overflow-wrap:anywhere;font-size:14px}.bl-l small{display:block;color:var(--muted);font-size:12px}
.bl-p{font:12px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.bl-a{font:500 14px var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.bl.planned{opacity:.55}.bl.planned .bl-a{font-style:italic}
.bl.tot{border-bottom:0}
.bsec-add{border:0;background:none;color:var(--pro);font-weight:500;font-size:13px;padding:8px 0 2px}
/* saisie enrichie */
.typesw.three{grid-template-columns:1fr 1fr 1fr}
.typesw button[aria-pressed="true"].tr{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.receipt,.items{display:grid;gap:10px;border:1px dashed var(--line);border-radius:var(--r);padding:12px}
.btn.file{display:inline-flex;justify-content:center;cursor:pointer}
.rcpt-prev{max-height:180px;width:auto;max-width:100%;border-radius:8px;justify-self:start;border:1px solid var(--line)}
.item{display:grid;gap:6px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.item-r{display:grid;grid-template-columns:1fr 84px 1fr auto;gap:6px}
.item input,.item select{padding:7px 8px}
.item .fam{font-size:13px;color:var(--muted)}
.rec{display:grid;gap:8px;padding:12px 0;border-bottom:1px solid var(--line)}
.rec-h{display:flex;justify-content:space-between;gap:8px;align-items:center}
.rec-r{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (min-width:700px){.rec-r{grid-template-columns:repeat(4,1fr)}}
/* comptes */
.acc{display:grid;gap:10px}
.acc-h{display:flex;justify-content:space-between;align-items:center;gap:10px;background:none;border:0;padding:0;text-align:left;width:100%}
.acc-h small{display:block;color:var(--muted);font-size:12px}
.big2{font-size:20px;font-weight:500}
.acc-d{border-top:1px solid var(--line);padding-top:8px}
/* écran de connexion */
.auth{min-height:calc(100vh - env(safe-area-inset-top,0px));display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-left,0px))}
.auth form{width:100%;max-width:380px;display:grid;gap:14px}
.auth .mark{width:56px;height:56px;border-radius:14px}
.auth h1{font:700 30px/1.05 var(--display);margin:0;letter-spacing:-.02em}
.auth p{margin:0}
.auth .err{color:var(--neg);font-size:14px}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .4s ease}}
</style>

    <div class="monthbar">
      <button id="prevM" aria-label="Mois précédent"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M10 3 5 8l5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>

      <button role="tab" data-v="reglages" aria-selected="false">Réglages</button>

</header>
<main class="wrap" id="main"><section class="view"><div class="empty"><h3>Chargement</h3><p>Récupération de vos comptes…</p></div></section></main>

</div>

<div id="toastHost"></div>

async function fetchAllTx(){

    if(error)throw error;out.push(...data);if(data.length<page)break;from+=page;}
  return out;
}
async function loadAll(){

/* ===================== Calculs fiscaux ===================== */
function microTotalRate(){
  const a=MICRO[S.activity]||MICRO.bnc_ssi;
  const acre=S.acre==="half"?.5:S.acre==="threeq"?.75:1;
  return {social:a.rate*acre, vl:S.vl?a.vl:0, cfp:+S.cfp||0, get total(){return this.social+this.vl+this.cfp}};
}
function proCalc(ca,charges){
  if(S.regime==="micro"){const r=microTotalRate();const cot=ca*r.total/100;return {cotis:cot,ir:0,net:ca-cot-charges};}
  if(S.regime==="reel"){const b=Math.max(0,ca-charges);const cot=b*(+S.reelRate||0)/100;return {cotis:cot,ir:0,net:ca-charges-cot};}
  if(S.regime==="societe_is"||S.regime==="sasu"){const res=ca-charges;const cot=Math.max(0,res)*(+S.dirigeantRate||0)/100;const is=Math.max(0,res-cot)*(+S.isRate||0)/100;return {cotis:cot,ir:is,net:res-cot-is};}
  return {cotis:0,ir:0,net:0};
}
function proMonth(key){
  const rows=TX.filter(t=>t.scope==="pro"&&t.month===key);
  const ca=sum(rows.filter(t=>t.type==="in"&&t.status!=="pending"));
  const pending=sum(rows.filter(t=>t.type==="in"&&t.status==="pending"));
  const charges=sum(rows.filter(t=>t.type==="out"&&t.group!=="urssaf"));
  return {ca,pending,charges,...proCalc(ca,charges)};
}
function foyerMonth(key){
  const rows=TX.filter(t=>t.scope==="foyer"&&t.month===key&&t.group!=="transfert");
  const inc=rows.filter(t=>t.type==="in");
  const by=g=>sum(rows.filter(t=>t.type==="out"&&t.group===g));
  const pro=S.regime==="salarie"?{net:0}:proMonth(key);
  const incomes=sum(inc)+pro.net;
  const fixe=by("fixe"),variable=by("variable"),dieu=by("dieu");
  const depenses=fixe+variable+dieu;
  return {rows,inc,proNet:pro.net,incomes,fixe,variable,dieu,depenses,impact:incomes-depenses};
}
function periodsOfYear(y){
  if(S.declaration==="month") return Array.from({length:12},(_,i)=>({id:mkey(y,i+1),label:MOIS[i]+" "+y,months:[mkey(y,i+1)],due:new Date(y,i+2,0)}));
  return [1,2,3,4].map(q=>({id:`${y}-T${q}`,label:`T${q} ${y}`,months:[1,2,3].map(k=>mkey(y,(q-1)*3+k)),due:new Date(y,q*3+1,0)}));
}
function urssafOwed(){
  let owed=0;const list=[];
  [cur.y-1,cur.y].forEach(y=>periodsOfYear(y).forEach(p=>{
    const c=sum(p.months.map(proMonth),x=>x.cotis);if(c<=0)return;
    if(!(S.paidPeriods||[]).includes(p.id)){owed+=c;list.push({...p,cotis:c});}
  }));
  return {owed,list};
}
function niceTicks(max){const step=Math.pow(10,Math.floor(Math.log10(max)));const s=[1,2,2.5,5,10].map(k=>k*step).find(v=>max/v<=4)||step*10;const out=[];for(let v=0;v<=max+s*0.999;v+=s)out.push(v);if(out.at(-1)<max)out.push(out.at(-1)+s);return out;}
function curKeyNow(){const n=new Date();return mkey(n.getFullYear(),n.getMonth()+1);}
function monthsElapsed(y){const n=new Date();return y<n.getFullYear()?12:y>n.getFullYear()?1:n.getMonth()+1;}

  }

function simuHtml(ytd){
  const n=monthsElapsed(cur.y);const ca=ytd.ca/n*12,ch=ytd.charges/n*12;

let sheet=null;
function canEdit(t){return t.source!=="coach"&&(t.scope==="foyer"||isOwner());}
function knownClients(){const s=new Set();TX.forEach(t=>t.client&&t.client.split(/[;+,]/).forEach(n=>n.trim()&&s.add(n.trim())));return [...s].sort();}
function errMsg(e){const m=(e&&(e.message||e.code))||"";if(/row-level security|permission|42501/i.test(m))return "Ton compte n'a pas le droit de faire cette modification.";if(/fetch|network/i.test(m))return "Pas de connexion internet, réessaie.";return "Enregistrement impossible pour l'instant, réessaie.";}
let toastT;function toast(m){$("#toastHost").innerHTML=`<div class="toast" role="status">${esc(m)}</div>`;clearTimeout(toastT);toastT=setTimeout(()=>$("#toastHost").innerHTML="",2600);}

let settingsWrite=Promise.resolve();
function saveSettings(patch){if(!isOwner())return;Object.assign(S,patch);render();
  settingsWrite=settingsWrite.then(async()=>{const {error}=await sb.from("cpta_settings").upsert({foyer_id:FOYER,data:S});if(error)toast(errMsg(error));});}
const debT={};function debounce(key,fn,ms=600){clearTimeout(debT[key]);debT[key]=setTimeout(fn,ms);}
function csv(sep=";"){const cols=["date","scope","type","group","cat","label","client","amount","status","method","saisi_par"];
  const q=v=>{v=String(v??"");return new RegExp(`["${sep}\\n]`).test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  return [cols.join(sep),...[...TX].sort((a,b)=>a.date.localeCompare(b.date)).map(t=>cols.map(c=>c==="amount"?String(t.amount).replace(".",","):c==="group"?q(GROUP_LABEL[t.group]||t.group):c==="saisi_par"?q(t.source==="coach"?"TB my Coach":memberName(t.created_by)):q(t[c])).join(sep))].join("\n");}

  const aa=$("#addAcc");if(aa)aa.onclick=async()=>{const {error}=await sb.from("cpta_accounts").insert({foyer_id:FOYER,name:"Nouveau compte",kind:"courant",balance:0,ord:ACC.length+1});if(error)toast(errMsg(error));else refresh();};
  const bindS=(id,key,num)=>{const el=$("#"+id);if(!el)return;const ev=el.type==="checkbox"||el.tagName==="SELECT"?"onchange":"oninput";el[ev]=()=>{const v=el.type==="checkbox"?el.checked:num?(parseFloat(el.value)||0):el.value;if(ev==="oninput")debounce(id,()=>saveSettings({[key]:v}),700);else saveSettings({[key]:v});}};
  [["s_regime","regime"],["s_activity","activity"],["s_acre","acre"],["s_declaration","declaration"],["s_vl","vl"]].forEach(([i,k])=>bindS(i,k));
  [["s_cfp","cfp"],["s_reelRate","reelRate"],["s_dirigeantRate","dirigeantRate"],["s_isRate","isRate"],["s_tvaSeuil","tvaSeuil"]].forEach(([i,k])=>bindS(i,k,true));
  const fn=$("#f_foyername");if(fn)fn.oninput=()=>debounce("fn",async()=>{const v=fn.value.trim();if(!v)return;const {error}=await sb.from("cpta_foyers").update({name:v}).eq("id",FOYER);if(error)toast(errMsg(error));else{FOYER_INFO().name=v;$("#brandName").textContent=v;toast("Nom enregistré");}},800);
  const dl=$("#s_dieuLabel");if(dl)dl.oninput=()=>debounce("dl",()=>saveSettings({labels:{...(S.labels||{}),dieu:dl.value.trim()||"Dons"}}),700);
  const fs=$("#foyerSwitch");if(fs)fs.onchange=async()=>{FOYER=fs.value;try{localStorage.setItem("compta.foyer",FOYER)}catch(e){}ROLE=FOYER_INFO().role;ready=false;await loadAll();render();};
  document.querySelectorAll("[data-split]").forEach(el=>el.oninput=()=>debounce("sp"+el.dataset.split,()=>saveSettings({split:{...S.split,[el.dataset.split]:+el.value||0}}),700));
  const am=$("#addMember");if(am)am.onclick=async()=>{const name=$("#m_name").value.trim(),email=$("#m_email").value.trim().toLowerCase();if(!name||!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){toast("Indique un prénom et un email valide");return;}const {error}=await sb.from("cpta_members").insert({foyer_id:FOYER,email,name,role:"member"});if(error){toast(/duplicate/i.test(error.message)?"Cet email est déjà membre":errMsg(error));return;}toast(`${name} ajouté·e au foyer`);refresh();};
  document.querySelectorAll("[data-delmember]").forEach(b=>b.onclick=async()=>{if(b.dataset.confirm!=="1"){b.dataset.confirm="1";b.textContent="Confirmer";return;}const {error}=await sb.from("cpta_members").delete().eq("foyer_id",FOYER).eq("email",b.dataset.delmember);if(error)toast(errMsg(error));else{toast("Membre retiré");refresh();}});
  const lo=$("#logout");if(lo)lo.onclick=async()=>{await sb.auth.signOut();location.reload();};
  bindExtra();
}
async function copyRecurring(){
  const k=curKey();
  const src=TX.filter(t=>t.month===prevKey()&&!t.source&&!t.rec_id&&(t.group==="fixe"||(t.group==="charge"&&isOwner())));
  const have=new Set(TX.filter(t=>t.month===k).map(t=>t.scope+t.label+t.cat));
  const todo=src.filter(t=>!have.has(t.scope+t.label+t.cat));
  if(!todo.length){toast("Ces charges sont déjà dans le mois");return;}
  const b=$("#copyRecur");if(b)b.disabled=true;
  const day=t=>{const d=+t.date.slice(8);const last=new Date(cur.y,cur.m,0).getDate();return String(Math.min(d,last)).padStart(2,"0");};
  const {error}=await sb.from("cpta_tx").insert(todo.map(t=>({foyer_id:FOYER,date:`${k}-${day(t)}`,type:t.type,scope:t.scope,grp:t.group,cat:t.cat,label:t.label,amount:t.amount,status:"paid",method:t.method||"",client:"",store:t.store||"",account_id:t.account_id||null})));
  if(error)toast(errMsg(error));else toast(`${todo.length} lignes recopiées`);
  refresh();
}

/* ===================== Écran de connexion ===================== */
function authScreen(mode="login",msg=""){
  $("#app").hidden=true;
  const T={login:["Connexion","Se connecter"],signup:["Créer mon compte","Créer le compte"],reset:["Mot de passe oublié","Recevoir le lien"],newpass:["Nouveau mot de passe","Enregistrer"]}[mode];
  $("#authHost").innerHTML=`<div class="auth"><form id="authForm" novalidate>
    <img class="mark" src="icon.svg" alt="">
    <h1>Comptabilité</h1>
    <p class="muted">Ton budget, tes revenus et ton épargne, au même endroit. Chaque compte est privé.</p>
    <h3 style="margin-top:6px">${T[0]}</h3>
    ${mode==="signup"?`<p class="small muted">Tu recevras un email de confirmation. Si on t'a invité dans un foyer, utilise l'email avec lequel on t'a invité.</p>`:""}
    ${mode!=="newpass"?`<label class="f"><span>Email</span><input type="email" id="a_email" autocomplete="email" required></label>`:""}
    ${mode!=="reset"?`<label class="f"><span>Mot de passe</span><input type="password" id="a_pass" autocomplete="${mode==="login"?"current-password":"new-password"}" minlength="8" required></label>`:""}
    <div class="${/^ok:/.test(msg)?"small pos":"err"}" id="a_msg" role="alert">${esc(msg.replace(/^ok:/,""))}</div>
    <button class="btn primary" type="submit" id="a_go">${T[1]}</button>
    <div class="toolbar small" style="justify-content:space-between">
      ${mode==="login"?`<button type="button" class="linkbtn" data-mode="signup">Créer mon compte</button><button type="button" class="linkbtn" data-mode="reset">Mot de passe oublié</button>`:`<button type="button" class="linkbtn" data-mode="login">J'ai déjà un compte</button>`}
    </div>
    <p class="note" style="margin:8px 0 0;text-align:center">Un outil offert par Thomas Boulet Coaching</p>
  </form></div>`;
  document.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>authScreen(b.dataset.mode));
  $("#authForm").onsubmit=async e=>{e.preventDefault();const em=$("#a_email")?.value.trim(),pw=$("#a_pass")?.value;const go=$("#a_go");go.disabled=true;const say=t=>{$("#a_msg").textContent=t.replace(/^ok:/,"");$("#a_msg").className=/^ok:/.test(t)?"small pos":"err";go.disabled=false;};
    try{
      if(mode==="login"){const {error}=await sb.auth.signInWithPassword({email:em,password:pw});if(error)return say(/confirm/i.test(error.message)?"Confirme d'abord ton email avec le lien reçu.":"Email ou mot de passe incorrect.");}
      else if(mode==="signup"){if((pw||"").length<8)return say("Choisis un mot de passe d'au moins 8 caractères.");const {data,error}=await sb.auth.signUp({email:em,password:pw,options:{emailRedirectTo:location.origin+location.pathname}});if(error)return say(/registered|exists/i.test(error.message)?"Ce compte existe déjà : connecte-toi.":"Création impossible : "+error.message);if(!data.session)return say("ok:Compte créé. Ouvre l'email de confirmation, puis reviens te connecter ici.");}
      else if(mode==="reset"){const {error}=await sb.auth.resetPasswordForEmail(em,{redirectTo:location.origin+location.pathname});if(error)return say("Envoi impossible, réessaie dans quelques minutes.");return say("ok:Si ce compte existe, un lien de réinitialisation vient d'être envoyé.");}
      else if(mode==="newpass"){if((pw||"").length<8)return say("Au moins 8 caractères.");const {error}=await sb.auth.updateUser({password:pw});if(error)return say("Modification impossible : "+error.message);history.replaceState(null,"",location.pathname);start();}
    }catch(err){say("Pas de connexion internet, réessaie.");}
  };
}
function onboardingScreen(canCreate){
  $("#app").hidden=true;
  if(!canCreate){
    $("#authHost").innerHTML=`<div class="auth"><div style="max-width:380px;display:grid;gap:14px"><img class="mark" src="icon.svg" alt=""><h1>Confirme ton email</h1><p class="muted">Ouvre le lien de confirmation reçu sur ${esc(ME.email)}, puis reviens ici et reconnecte-toi.</p><button class="btn" id="noOut">Se reconnecter</button></div></div>`;
    $("#noOut").onclick=async()=>{await sb.auth.signOut();authScreen();};return;
  }
  const regOpts=Object.entries(REGIMES).map(([k,l])=>`<option value="${k}" ${k==="salarie"?"selected":""}>${k==="salarie"?"Salarié, sans activité indépendante":l}</option>`).join("");
  $("#authHost").innerHTML=`<div class="auth"><form id="obForm" style="max-width:420px">
    <img class="mark" src="icon.svg" alt="">
    <h1>Bienvenue</h1>
    <p class="muted">Crée ta comptabilité personnelle. Elle est privée : personne d'autre que toi (et les personnes que tu invites) ne peut la voir.</p>
    <label class="f"><span>Ton prénom</span><input type="text" id="ob_name" required autocomplete="given-name"></label>
    <label class="f"><span>Nom de ta comptabilité</span><input type="text" id="ob_foyer" placeholder="ex. Famille Martin" required></label>
    <label class="f"><span>Ta situation</span><select id="ob_regime">${regOpts}</select></label>
    <label class="f" id="ob_actWrap" hidden><span>Nature de l'activité</span><select id="ob_act">${Object.entries(MICRO).map(([k,v])=>`<option value="${k}" ${k==="bnc_ssi"?"selected":""}>${v.label}</option>`).join("")}</select></label>
    <div class="err" id="ob_msg" role="alert"></div>
    <button class="btn primary" type="submit" id="ob_go">Créer ma comptabilité</button>
    <button class="linkbtn" type="button" id="ob_out">Se déconnecter</button>
  </form></div>`;
  const rg=$("#ob_regime");rg.onchange=()=>{$("#ob_actWrap").hidden=rg.value!=="micro"};
  $("#ob_out").onclick=async()=>{await sb.auth.signOut();authScreen();};
  $("#obForm").onsubmit=async e=>{e.preventDefault();const name=$("#ob_name").value.trim(),foyer=$("#ob_foyer").value.trim();if(!name||!foyer){$("#ob_msg").textContent="Indique ton prénom et un nom.";return;}
    $("#ob_go").disabled=true;
    const settings={...DEFAULT_SETTINGS,regime:rg.value,activity:$("#ob_act").value,owner:name,household:foyer};
    const {error}=await sb.rpc("cpta_create_foyer",{p_name:foyer,p_display:name,p_settings:settings});
    if(error){$("#ob_msg").textContent="Création impossible : "+error.message;$("#ob_go").disabled=false;return;}
    start();
  };
}

/* ===================== Démarrage ===================== */
$("#tabs").onclick=e=>{const b=e.target.closest("button[data-v]");if(b)setView(b.dataset.v)};
$("#prevM").onclick=()=>{cur.m--;if(cur.m<1){cur.m=12;cur.y--}render()};
$("#nextM").onclick=()=>{cur.m++;if(cur.m>12){cur.m=1;cur.y++}render()};
$("#fab").onclick=()=>openSheet();
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&sheet)closeSheet()});

let recovering=false;
sb.auth.onAuthStateChange((ev)=>{if(ev==="PASSWORD_RECOVERY"){recovering=true;authScreen("newpass");}});
let starting=false;
async function start(){
  if(starting)return;starting=true;
  const {data:{session}}=await sb.auth.getSession();
  starting=!!session;
  if(recovering)return;
  if(!session){authScreen();return;}
  ME=session.user;
  const {data:sess,error}=await sb.rpc("cpta_session");
  if(error||!sess){starting=false;authScreen("login","Connexion impossible, réessaie.");return;}
  FOYERS=sess.foyers||[];
  if(!FOYERS.length){starting=false;onboardingScreen(sess.can_create);return;}
  let saved=null;try{saved=localStorage.getItem("compta.foyer")}catch(e){}
  FOYER=(FOYERS.find(f=>f.id===saved)||FOYERS.find(f=>f.role==="owner")||FOYERS[0]).id;
  ROLE=FOYER_INFO().role;
  $("#authHost").innerHTML="";$("#app").hidden=false;
  try{await loadAll();}catch(e){$("#main").innerHTML=`<section class="view"><div class="empty"><h3>Chargement impossible</h3><p>Vérifie ta connexion puis rouvre l'app.</p></div></section>`;return;}
  $("#who").textContent=memberName(ME.id)||ME.email;
  render();
}
sb.auth.onAuthStateChange((ev)=>{if(ev==="SIGNED_IN"&&!ROLE&&!recovering)start();});
start();
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
